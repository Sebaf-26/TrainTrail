# Builds TrainTrail from this repository, so it can be deployed as a Git stack
# (for example in Portainer) without a published image.
#
# Variables, set in a .env file or in the stack's environment variables:
#   ORIGIN        required. The exact URL you open TrainTrail with, e.g. https://trains.example.com
#   DB_PASSWORD   required. Letters and digits only. Postgres keeps the password it was first started
#                 with, so choose it before the first start.
#   PORT          optional. The port published on the host (default 8096). Inside the container
#                 the app always listens on 3000.
#   ADDRESS_HEADER, PUID, PGID, TZ: optional, see below.
#
# Optional: routes along the real tracks instead of straight lines. It is a
# separate service that is not started unless you ask for it, so it can never
# block the stack: set COMPOSE_PROFILES=routing (in the .env file or in the
# stack's environment variables) and redeploy. The first start downloads the
# OpenStreetMap extract and builds the graph, which takes a while.
#   RAIL_OSM_URL     the .osm.pbf extract to route on (default: Italy, about 2.2 GB).
#                    A smaller region from download.geofabrik.de is fine; rebuilding
#                    starts by itself when it changes.
#   RAIL_OSM_URLS    several extracts, separated by commas, merged into one: a journey
#                    abroad needs the tracks of both countries. When set, it is used
#                    instead of RAIL_OSM_URL. For Italy, Austria, Switzerland and France:
#                    https://download.geofabrik.de/europe/italy-latest.osm.pbf,https://download.geofabrik.de/europe/austria-latest.osm.pbf,https://download.geofabrik.de/europe/switzerland-latest.osm.pbf,https://download.geofabrik.de/europe/france-latest.osm.pbf
#                    Needs the free disk of the extracts twice (they are merged, then
#                    the separate files are removed).
#   RAIL_JAVA_OPTS   Java options, default "-Xmx4g -Xms256m". The container needs more
#                    memory than the heap: see RAIL_MEM_LIMIT.
#   RAIL_MEM_LIMIT   memory limit of the container (default 6g).
#
# To use a published image instead, see docker/production/compose.yml.
services:
  db:
    container_name: traintrail_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traintrail
      POSTGRES_USER: traintrail
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      # To keep the database in a folder on the host, use a bind mount such as
      # /srv/traintrail/db:/var/lib/postgresql/data
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U traintrail -d traintrail']
      interval: 5s
      timeout: 5s
      retries: 5

  traintrail:
    container_name: traintrail
    # No `image:` here on purpose: with one, `docker compose pull` (run by Portainer
    # before every deploy) tries to download it from Docker Hub and fails.
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-8096}:3000'
    environment:
      ORIGIN: ${ORIGIN:?Set ORIGIN to the URL you open TrainTrail with}
      DB_URL: postgres://traintrail:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/traintrail
      UPLOAD_LOCATION: /app/uploads
      # Behind a reverse proxy, the header carrying the client address
      # (X-Forwarded-For). Leave empty when clients connect directly.
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      # User and group the uploads folder is given to on every start.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Rome}
      # Where the optional rail-routing service listens. Without it, journeys
      # keep the straight line between their stations.
      RAIL_ROUTING_URL: ${RAIL_ROUTING_URL:-http://rail-routing:8989}
    volumes:
      # To keep uploads in a folder on the host, use a bind mount such as
      # /srv/traintrail/uploads:/app/uploads
      - uploads:/app/uploads

  # Real rail routes (OpenRailRouting on OpenStreetMap data). Only started with
  # COMPOSE_PROFILES=routing. Not published on the host: only TrainTrail reaches it.
  rail-routing:
    container_name: traintrail_rail_routing
    profiles: ['routing']
    # No `image:` here either, for the same reason as above.
    build:
      context: .
      dockerfile: docker/rail-routing/Dockerfile
    restart: unless-stopped
    mem_limit: ${RAIL_MEM_LIMIT:-6g}
    environment:
      RAIL_OSM_URL: ${RAIL_OSM_URL:-https://download.geofabrik.de/europe/italy-latest.osm.pbf}
      RAIL_OSM_URLS: ${RAIL_OSM_URLS:-}
      RAIL_JAVA_OPTS: ${RAIL_JAVA_OPTS:--Xmx4g -Xms256m}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      # The extract and the graph built from it. To keep them in a folder on
      # the host, use a bind mount such as /srv/traintrail/rail:/data
      - rail_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8989/health || exit 1']
      interval: 1m
      timeout: 10s
      retries: 3
      # The first start imports the whole extract.
      start_period: 60m

volumes:
  db_data:
  uploads:
  rail_data:
