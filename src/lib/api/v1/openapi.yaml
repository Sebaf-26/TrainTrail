        - topOperator
        - topStation
        - topTrain
        - topRoute
      properties:
        journeys:
          type: integer
        distanceKm:
          type: integer
        durationSeconds:
          type: integer
        stations:
          type: integer
        topOperator:
          type: [object, 'null']
        topStation:
          type: [object, 'null']
        topTrain:
          type: [object, 'null']
        topRoute:
          type: [object, 'null']
    StatsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Stats'
    Preferences:
      type: object
      properties:
        distanceUnit:
          type: string
          enum: [km, mi]
        timeFormat:
          type: string
          enum: [12h, 24h, auto]
        dateFormat:
          type: string
          enum: [iso, us, eu, auto]
        weekStartsOn:
          type: string
          enum: [mon, sun, auto]
        journeyTimeDisplay:
          type: string
          enum: [station, utc, system]
    VisitedCountryInput:
