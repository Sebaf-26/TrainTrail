            userCount:
              type: integer
            oauthMappingCount:
              type: integer
            isDefault:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    UsersResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/User'
            properties:
              canManage:
                type: boolean
              roleId:
                type: [string, 'null']
              roleName:
                type: [string, 'null']
              isOwner:
                type: boolean
    RolesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    CustomField:
      type: object
      required:
        - id
        - entityType
        - key
        - label
        - fieldType
        - required
        - order
      properties:
        id:
          type: integer
        entityType:
          type: string
          enum: [journey, journey_passenger]
        key:
          type: string
        label:
          type: string
        description:
          type: [string, 'null']
        fieldType:
          type: string
          enum:
            - text
            - textarea
            - number
            - boolean
            - date
            - select
            - multi-select
            - station
            - operator
            - train
        required:
          type: boolean
        order:
          type: integer
        defaultValue:
          {}
        options:
          {}
    CustomFieldsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomField'
    CreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id]
          properties:
            id:
              oneOf:
                - type: string
                - type: integer
    UpdatedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
