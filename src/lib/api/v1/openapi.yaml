        expiresAt:
          type: [string, 'null']
          format: date-time
        showMap:
          type: boolean
        showStats:
          type: boolean
        showJourneyList:
          type: boolean
        dateFrom:
          type: [string, 'null']
        dateTo:
          type: [string, 'null']
        showTrainNumbers:
          type: boolean
        showOperators:
          type: boolean
        showTrain:
          type: boolean
        showTimes:
          type: boolean
        showTracks:
          type: boolean
        showDates:
          type: boolean
        showSeat:
          type: boolean
    Share:
      allOf:
        - $ref: '#/components/schemas/ShareInput'
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time
    ShareResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Share'
    SharesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Share'
    RoleInput:
      type: object
