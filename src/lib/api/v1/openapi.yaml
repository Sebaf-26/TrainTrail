        code:
          type: string
          minLength: 2
          maxLength: 2
        status:
          type: string
          enum: [lived, visited, layover, wishlist]
        note:
          type: [string, 'null']
    VisitedCountryResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/VisitedCountry'
    VisitedCountriesResponse:
      type: object
      required: [data]
      properties:
        data:
